name: sankofa_flutter
description: "Flutter client SDK for Sankofa Analytics with offline queueing and session replay."
version: 0.1.0
homepage: https://sankofa.dev
repository: https://github.com/Sankofa-HQ/sankofa_sdk_flutter
issue_tracker: https://github.com/Sankofa-HQ/sankofa_sdk_flutter/issues

environment:
  sdk: ^3.10.1
  flutter: ">=3.38.0"

dependencies:
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0
  carrier_info: ^3.0.3
  app_links: ^7.0.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # ── Federated plugin declaration ───────────────────────────────────
  # Phase C — native crash bridging. The Dart-side Catch (`SankofaCatch`
  # in lib/src/catch/) catches Dart-level errors (FlutterError.onError,
  # PlatformDispatcher.onError, isolate listeners) but cannot see
  # NSException / POSIX signals on iOS or JVM-uncaught exceptions / ANRs
  # on Android. This plugin section wires `SankofaFlutterPlugin` on each
  # platform to bootstrap the underlying native Sankofa SDK's Catch
  # module, which DOES handle those native crash paths. Both Dart and
  # native sides POST to the same `/api/catch/events` endpoint with
  # disjoint event sources, so no dedup is needed.
  #
  # The plugin is a no-op when SankofaCatch isn't auto-started (i.e.
  # the host passed `enableCatch: false` to `Sankofa.instance.init(...)`).
  plugin:
    platforms:
      android:
        package: dev.sankofa.flutter
        pluginClass: SankofaFlutterPlugin
      ios:
        pluginClass: SankofaFlutterPlugin

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
