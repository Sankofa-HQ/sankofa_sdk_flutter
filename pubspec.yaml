name: sankofa_flutter
description: "Sankofa Flutter SDK — OTA code-push updates (Deploy), product analytics, session replay, crash reporting (Catch), feature flags (Switch), remote config, and in-app surveys (Pulse). Offline queueing and signed, integrity-checked updates built in."
version: 0.2.8
homepage: https://sankofa.dev
repository: https://github.com/Sankofa-HQ/sankofa_sdk_flutter
issue_tracker: https://github.com/Sankofa-HQ/sankofa_sdk_flutter/issues

environment:
  sdk: ^3.10.1
  flutter: ">=3.38.0"

dependencies:
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0
  carrier_info: ^3.0.3
  app_links: ^7.0.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  uuid: ^4.5.3

  # β.4 — sha-256 verification for SANKOFA_KBC_ENVELOPE patches loaded
  # via Sankofa.deploy.applyKbcPatchFromBytes / applyKbcPatchFromFile.
  # `package:crypto` is a Dart team-maintained pub.dev package, no
  # transitive native deps, < 30 kB. Required only for iOS Path C
  # (KBC interpreter OTA); harmless on Android baseline path which
  # uses libapp.so binary-diff and skips this entirely.
  crypto: ^3.0.0

  # v2 envelope MVP — Ed25519 signature verification on downloaded KBC
  # envelopes. Producer-side (CLI) signs the envelope with the project's
  # private key; SDK-side verifies against the public key embedded at
  # app init via Sankofa.initialize(deploySigningPubkey: '...').
  # `cryptography` is a Dart team-aligned pub.dev package with pure-Dart
  # Ed25519 implementation (no native bindings), ~80 kB.
  cryptography: ^2.7.0

  # η v1 — Sankofa.deploy.fetchAndApplyKbcPatch needs the iOS app's
  # Documents directory so it can stage the downloaded envelope at
  # the conventional `<Documents>/sankofa-deploy/patches/active/
  # patch.skdp` path that the on-device demo + cold-boot apply read
  # from. path_provider is already an indirect dep of most Flutter
  # apps; declaring it here makes the SDK self-contained.
  path_provider: ^2.1.0

  # `dynamic_modules` is the Sankofa-fork Dart SDK's binding to
  # `dart:_internal.loadDynamicModule` — the VM entry point we use to
  # bring a downloaded patch into the running isolate.
  #
  # Customers add `sankofa_flutter: ^X.Y.Z` only. The standalone
  # trampoline at `sankofa-dart-sdk/standalone/dynamic_modules/` (a
  # clean copy with no monorepo path deps) is pulled in transitively
  # via this git ref, so the customer's `main()` is just:
  #
  #     await SankofaUpdater.preFlight();
  #
  # No `dynamic_modules` import, no `registerLoader` — sankofa_flutter
  # imports it internally on the customer's behalf.
  # NOTE: `dynamic_modules` is NOT a dependency. Pub.dev refuses git
  # and path deps in published packages, and the underlying binding
  # imports `dart:_internal` which can't be published as a hosted
  # package. We vendored the 5-line wrapper into
  # `lib/src/deploy/_dynamic_modules.dart` instead. Customer code
  # never imports `dynamic_modules` — `SankofaUpdater.preFlight()`
  # picks the vendored binding up internally.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # ── Federated plugin declaration ───────────────────────────────────
  # Phase C — native crash bridging. The Dart-side Catch (`SankofaCatch`
  # in lib/src/catch/) catches Dart-level errors (FlutterError.onError,
  # PlatformDispatcher.onError, isolate listeners) but cannot see
  # NSException / POSIX signals on iOS or JVM-uncaught exceptions / ANRs
  # on Android. This plugin section wires `SankofaFlutterPlugin` on each
  # platform to bootstrap the underlying native Sankofa SDK's Catch
  # module, which DOES handle those native crash paths. Both Dart and
  # native sides POST to the same `/api/catch/events` endpoint with
  # disjoint event sources, so no dedup is needed.
  #
  # The plugin is a no-op when SankofaCatch isn't auto-started (i.e.
  # the host passed `enableCatch: false` to `Sankofa.instance.init(...)`).
  plugin:
    platforms:
      android:
        package: dev.sankofa.flutter
        pluginClass: SankofaFlutterPlugin
      ios:
        pluginClass: SankofaFlutterPlugin

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
